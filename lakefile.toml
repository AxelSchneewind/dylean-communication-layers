name = "dylean-communication-layers"
version = "0.1.0"
defaultTargets = ["Library", "PrintTrace"]

# matches dependency of DyLibraries
[[require]]
name = "dylean"
git = "https://github.com/BobDylean/dylean" 
rev = "main"

[[require]]
name = "DyLibraries"
git = "https://github.com/sec-stuttgart/dylean-libraries"
rev = "master"

[[lean_lib]]
name = "Library"

[[lean_lib]]
name = "DyleanExtensions"

[[lean_exe]]
name = "PrintTrace"
root = "Library.Examples.PrintTrace"
